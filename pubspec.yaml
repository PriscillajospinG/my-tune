name: mytune
description: "MyTune - A modern, cross-platform local music player."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.3

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Audio playback + background service (industry-standard Flutter combo)
  just_audio: ^0.9.44
  audio_service: ^0.18.15
  audio_session: ^0.1.25

  # Database — sqflite requires NO code generation
  sqflite: ^2.4.1
  path: ^1.9.0
  path_provider: ^2.1.5

  # State management
  flutter_riverpod: ^2.6.1

  # Navigation
  go_router: ^14.8.1

  # File picking (iOS + Android fallback)
  file_picker: ^8.1.7

  # Device audio querying (Android MediaStore + iOS MPMediaQuery)
  on_audio_query: ^2.9.0

  # Permissions
  permission_handler: ^11.4.0

  # Utilities
  uuid: ^4.5.1
  rxdart: ^0.28.0

  # YouTube integration
  http: ^1.2.2
  url_launcher: ^6.3.1
  cached_network_image: ^3.4.1
  connectivity_plus: ^6.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/audio/
    - assets/images/
