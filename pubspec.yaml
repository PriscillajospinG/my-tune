name: mytune
description: "MyTune - A modern, cross-platform local music player."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.3

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Audio playback + background service
  just_audio: ^0.9.44
  audio_service: ^0.18.15
  just_audio_background: ^0.0.1-beta.14

  # Database
  isar: ^3.1.0+1
  isar_flutter_libs: ^3.1.0+1
  path_provider: ^2.1.5

  # State management
  flutter_riverpod: ^2.6.1

  # Navigation
  go_router: ^14.8.1

  # File picking (for iOS and as fallback on Android)
  file_picker: ^8.1.7

  # Device audio querying (Android MediaStore + iOS MPMediaQuery) — no Rust required
  on_audio_query: ^2.9.0

  # Permissions
  permission_handler: ^11.4.0

  # Utilities
  uuid: ^4.5.1
  rxdart: ^0.28.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  isar_generator: ^3.1.0+1
  build_runner: ^2.4.15

flutter:
  uses-material-design: true

  assets:
    - assets/audio/
    - assets/images/
