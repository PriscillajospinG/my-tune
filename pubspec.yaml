name: mytune
description: "MyTune - A modern, cross-platform local music player."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.3

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Audio playback + background service
  just_audio: ^0.9.44
  audio_service: ^0.18.15
  just_audio_background: ^0.0.1-beta.14

  # Database
  isar: ^3.1.0+1
  isar_flutter_libs: ^3.1.0+1
  path_provider: ^2.1.5

  # State management
  flutter_riverpod: ^2.6.1

  # Navigation
  go_router: ^14.8.1

  # File picking & metadata
  file_picker: ^8.1.7
  metadata_god: ^0.6.0+1

  # Permissions
  permission_handler: ^11.4.0

  # Image
  cached_network_image: ^3.4.1

  # Palette from album art
  palette_generator: ^0.3.3+4

  # Utilities
  uuid: ^4.5.1
  intl: ^0.20.2
  rxdart: ^0.28.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  isar_generator: ^3.1.0+1
  build_runner: ^2.4.15

flutter:
  uses-material-design: true

  assets:
    - assets/audio/
    - assets/images/
    - assets/fonts/

  fonts:
    - family: Outfit
      fonts:
        - asset: assets/fonts/Outfit-Regular.ttf
          weight: 400
        - asset: assets/fonts/Outfit-Medium.ttf
          weight: 500
        - asset: assets/fonts/Outfit-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Outfit-Bold.ttf
          weight: 700
